<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="株式会社スプリングの名前に込めた想い。"><title>スプリングについて｜株式会社スプリング</title><link rel="icon" href="./spring-favicon.png"><link rel="stylesheet" href="./styles.css"><script defer src="./menu.js"></script></head><body><main class="subpage about-page"><section class="page-hero"><p class="page-no">01</p><div><p class="eyebrow">ABOUT SPRING</p><h1>春のように始まり、<br>泉のように湧き出る。</h1></div><p class="vertical-note">名前に込めた、二つの意味。</p></section><section class="story-section"><p class="label"><b>01</b> OUR NAME</p><div class="story-grid"><h2>Springという<br>名前に込めた想い</h2><div><p>Spring（スプリング）は「春」。春は、さまざまなことがスタートする時期です。</p><p>また、Springには「泉、湧き水」という意味もあります。</p><p>スプリングで学び、身につけたことがその後の人生に弾みをつけ、さらにさまざまなアイデアが湧き出るように生まれ、可能性が広がることを願っています。</p></div></div></section><section class="page-next"><small>NEXT STORY</small><a href="./english.html">英語教室について <span>→</span></a></section><footer><img src="./spring-logo.png" alt="株式会社スプリング"><p>英語と、さをり織り。<br>新しい可能性が芽吹く場所。</p><small>© 株式会社スプリング</small></footer></main></body></html>
